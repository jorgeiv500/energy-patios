[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-patios"
version = "0.1.0"
description = "Optimization workflow for electric bus depots, rooftop PV, storage, and grid capacity in Bogota."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
